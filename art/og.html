<!doctype html>
<!-- Source for public/og.png (1200×630 link-preview card). Render from this folder so ../public paths resolve. -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,500;1,900&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; background: #0c0819; overflow: hidden;
               font-family: Rubik, "Liberation Sans", Arial, sans-serif; color: #f4f0ff; }
  .grid { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(2, 1fr); }
  .grid img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .shade { position: absolute; inset: 0;
           background: radial-gradient(70% 80% at 50% 50%, rgba(12,8,25,.93) 30%, rgba(12,8,25,.55) 100%); }
  .plate { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .plate img { width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 12px 30px rgba(0,0,0,.5); }
  h1 { margin: 22px 0 0; font-weight: 900; font-style: italic; font-size: 92px; line-height: .92; text-transform: uppercase; }
  h1 span { color: #ffd23f; text-shadow: 0 5px 0 #c2185b; }
  p { margin: 20px 0 0; font-weight: 500; font-size: 30px; color: #d9d2f0; letter-spacing: .01em; }
  p b { color: #3ee8ff; }
</style></head><body>
  <div class="grid">
    <img src="../public/games/kartchaos/cover.webp">
    <img src="../public/games/obbyrush/cover.webp">
    <img src="../public/games/snackmerge/cover.webp">
    <img src="../public/games/orbitdepot/cover.webp">
    <img src="../public/games/bonkbrawl/cover.webp">
    <img src="../public/games/cityrush/cover.webp">
    <img src="../public/games/orderup/cover.webp">
    <img src="../public/games/orbyt/cover.webp">
    <img src="../public/games/graveshift/cover.webp">
    <img src="../public/games/spacediner/cover.webp">
  </div>
  <div class="shade"></div>
  <div class="plate">
    <img src="../public/icon-512.png">
    <h1>Mello Vibes <span>Games</span></h1>
    <p><b>10</b> free games · play in your browser · no downloads</p>
  </div>
</body></html>
